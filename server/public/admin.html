<meta charset="utf-8" />
<title>FTR Chef's Kitchen</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F7F1E8">
<link rel="icon" href="/app/seal.png" type="image/png">
<link rel="apple-touch-icon" href="/app/seal.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=Josefin+Sans:wght@600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first app shell - header, one scrolling view, bottom tab bar (side rail on wide screens), sticky save bar when edits are pending. */
:root {
  /* FTR brand, same as the FTR-DOSE app ("Warm Sand"): sand paper, cocoa ink,
     soft brick buttons, and the charcoal + gold of the FTR kitchen seal. */
  --bg: #F7F1E8;
  --surface: #FFFDF9;
  --surface-2: #EEE6D8;
  --line: #E4D8C6;
  --fg: #3E2C28;
  --muted: #6E5D55;
  --leaf: #A4483F;         /* soft brick - actions */
  --leaf-ink: #FFFFFF;
  --leaf-soft: #F3DED9;
  --turmeric: #B9954A;     /* seal gold - waiting on you */
  --turmeric-soft: #F1E2C4;
  --turmeric-ink: #6B4A1E;
  --good: #4F6B57; --good-soft: #E3EADF;
  --bad: #9E3A2E;  --bad-soft: #F6DCD6;
  --info: #3F5F7A; --info-soft: #E0E8EF;
  --chili: #A4483F; --chili-soft: #F3DED9; --chili-ink: #7E3029;
  --charcoal: #2E2A26; --gold: #D4A84A;
  --shadow: 0 1px 2px rgba(62,44,40,.06), 0 6px 18px rgba(62,44,40,.07);
  --f-display: "Oswald", "Arial Narrow", sans-serif;
  --f-logo: "Josefin Sans", "Futura", "Century Gothic", sans-serif;
  --f-body: "Archivo", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-serif: "Fraunces", Georgia, serif;
  --r: 14px;
  --tab-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1F1B18; --surface: #2A2521; --surface-2: #35302B; --line: #433C35;
  --fg: #F3EBDD; --muted: #BFB2A3; --leaf: #E08A7E; --leaf-ink: #2E2A26; --leaf-soft: #432823;
  --turmeric: #D9B76A; --turmeric-soft: #3A2F1A; --turmeric-ink: #E9C77B;
  --good: #9CC0A6; --good-soft: #26332A; --bad: #F08A7C; --bad-soft: #3D2420; --info: #9DB8D2; --info-soft: #22303C;
  --chili: #E08A7E; --chili-soft: #43231D; --chili-ink: #F2B3A8;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1F1B18; --surface: #2A2521; --surface-2: #35302B; --line: #433C35;
  --fg: #F3EBDD; --muted: #BFB2A3; --leaf: #E08A7E; --leaf-ink: #2E2A26; --leaf-soft: #432823;
  --turmeric: #D9B76A; --turmeric-soft: #3A2F1A; --turmeric-ink: #E9C77B;
  --good: #9CC0A6; --good-soft: #26332A; --bad: #F08A7C; --bad-soft: #3D2420; --info: #9DB8D2; --info-soft: #22303C;
  --chili: #E08A7E; --chili-soft: #43231D; --chili-ink: #F2B3A8;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app { min-height: 100%; display: flex; flex-direction: column; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 3px solid var(--turmeric);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.mark { width: 40px; height: 40px; flex: none; display: block; }
.brand h1 { font: 500 19px/1.1 var(--f-display); margin: 0; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { display: block; color: var(--muted); font-size: 12px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; flex: none; color: var(--fg); text-decoration: none;
}
.top-actions { display: flex; gap: 8px; flex: none; }
button.icon-btn { font: inherit; cursor: pointer; }
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.icon-btn[aria-current="page"] { background: var(--leaf-soft); border-color: var(--leaf); color: var(--leaf); }

.preview-banner {
  background: var(--info-soft); color: var(--info); font-size: 13px; font-weight: 600;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main#view {
  flex: 1; width: 100%; max-width: 760px; margin: 0 auto;
  padding-block: 18px calc(var(--tab-h) + 96px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: repeat(6, 1fr);
}
nav.tabs a {
  height: var(--tab-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600; position: relative; white-space: nowrap;
}
nav.tabs a svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }
nav.tabs a[aria-current="page"] { color: var(--leaf); }
nav.tabs a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--leaf); }
.dot { position: absolute; top: 9px; left: calc(50% + 7px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--turmeric); color: #1c1400; font-size: 11px; line-height: 18px; font-weight: 700; text-align: center; }

@media (min-width: 900px) {
  .app { padding-left: 92px; }
  nav.tabs { top: 0; bottom: 0; right: auto; width: 92px; grid-template-columns: 1fr; grid-auto-rows: 76px; align-content: start; border-top: 0; border-right: 1px solid var(--line); padding-top: calc(env(safe-area-inset-top, 0px) + 70px); }
  nav.tabs a { height: 76px; }
  nav.tabs a[aria-current="page"]::before { top: 18%; bottom: 18%; left: 0; right: auto; width: 3px; height: auto; border-radius: 0 3px 3px 0; }
  main#view { padding-bottom: 120px; }
}

/* ---------- type & blocks ---------- */
.h-page { font: 700 clamp(24px, 6vw, 30px)/1.1 var(--f-display); margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.h-sec { font: 700 13px/1 var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 6px 0 -6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.h-sec .btn { text-transform: none; letter-spacing: 0; color: var(--leaf); font-size: 13.5px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 620px) { .kpis.four { grid-template-columns: repeat(4, 1fr); } }
.kpi { padding: 14px 16px; }
.kpi b { display: block; font: 700 26px/1.1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.kpi.attn { background: var(--turmeric-soft); border-color: transparent; }
.kpi.attn b { color: var(--turmeric-ink); }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.p-wait { background: var(--turmeric-soft); color: var(--turmeric-ink); }
.p-good { background: var(--good-soft); color: var(--good); }
.p-bad { background: var(--bad-soft); color: var(--bad); }
.p-info { background: var(--info-soft); color: var(--info); }
.p-off { background: var(--surface-2); color: var(--muted); }
.p-ff { background: var(--chili-soft); color: var(--chili-ink); }
.stars { color: var(--turmeric); font-size: 15px; letter-spacing: 1px; white-space: nowrap; }
.stars .off { color: var(--line); }
.sel-sm { font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.qr-row { display: flex; gap: 14px; align-items: flex-start; }
.qr-box { width: 112px; height: 112px; flex: none; border: 1px dashed var(--line); border-radius: 14px; display: grid; place-items: center; text-align: center; padding: 6px; background: var(--surface-2); overflow: hidden; }
.qr-box img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; background: #fff; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 42px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; text-decoration: none; color: var(--fg); white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--leaf); border-color: var(--leaf); color: var(--leaf-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); border-color: var(--bad-soft); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px;
  font-size: 13.5px; font-weight: 600; white-space: nowrap; color: var(--muted);
}
.decide { flex-wrap: wrap; gap: 8px; padding: 10px 0 2px; border-top: 1px dashed var(--line); margin-top: 6px; }
.decide .small { flex-basis: 100%; }
.chip[aria-pressed="true"] { background: var(--leaf); border-color: var(--leaf); color: var(--leaf-ink); }
.chip .c { opacity: .8; margin-left: 4px; }

/* fields */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea, .search {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--surface); font-size: 16px;
}
.field textarea { min-height: 88px; resize: vertical; line-height: 1.45; }
.field .hint { font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
/* iPhone draws time/date boxes wider than their column unless told not to. */
.field input[type="time"], .field input[type="date"] {
  -webkit-appearance: none; appearance: none; display: block;
  width: 100%; min-width: 0; max-width: 100%; box-sizing: border-box; text-align: left;
}
.field input[type="time"]::-webkit-date-and-time-value, .field input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
@media (max-width: 420px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.prefix { position: relative; }
.prefix input { padding-left: 26px; }
.prefix::before { content: "$"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; }
.switch { display: flex; align-items: center; gap: 12px; padding: 10px 0; cursor: pointer; }
.switch input { appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; flex: none; transition: background .15s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked { background: var(--leaf); }
.switch input:checked::after { transform: translateX(18px); }
.switch span b { display: block; font-weight: 600; }
.switch span small { color: var(--muted); font-size: 12.5px; }

/* lists */
.list { display: flex; flex-direction: column; }
.li {
  display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--line);
  background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%;
}
.li:first-child { border-top: 0; }
button.li:hover { background: var(--surface-2); }
.li .t { font-weight: 600; }
.li .d { font-size: 13px; color: var(--muted); }
.li .price { font-weight: 700; font-variant-numeric: tabular-nums; }
.chev { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; flex: none; }

/* orders */
.order { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.order.wait { border-left: 4px solid var(--turmeric); }
.o-top { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.o-name { font-weight: 700; font-size: 16px; }
.o-meta { font-size: 12.5px; color: var(--muted); }
.o-items { font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
.o-items .note { color: var(--muted); font-style: italic; }
.o-facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13.5px; }
.o-facts dt { color: var(--muted); }
.o-facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.o-total { font: 700 18px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.o-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.wa { color: var(--leaf); text-decoration: none; font-weight: 600; font-size: 13px; }

/* chef days */
.day { overflow: hidden; }
.day-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; background: none; border: 0; text-align: left; }
.cal { width: 50px; flex: none; text-align: center; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.cal i { display: block; font-style: normal; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--surface-2); color: var(--muted); padding: 2px 0; }
.cal b { display: block; font: 700 20px/1.25 var(--f-display); font-variant-numeric: tabular-nums; }
.day.open .cal i { background: var(--leaf); color: var(--leaf-ink); }
.day-sum { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }
.day-body { border-top: 1px solid var(--line); padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 14px; }
.day-sec h4 { margin: 10px 0 6px; font-size: 13px; font-weight: 700; }
.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tog {
  border: 1.5px dashed var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); text-align: left;
  display: flex; flex-direction: column; gap: 1px;
}
.tog b { font-size: 14px; }
.tog small { color: var(--muted); font-size: 12px; }
.tog[aria-pressed="true"] { border-style: solid; border-color: var(--leaf); background: var(--leaf-soft); }
.tog[aria-pressed="true"] b { color: var(--leaf); }
.win { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.win input[type=time] { min-height: 42px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 15px; }
.win .to { color: var(--muted); font-size: 13px; }

/* month calendar */
.cal-nav { display: flex; align-items: center; gap: 8px; }
.cal-nav h3 { flex: 1; margin: 0; font: 700 20px/1.2 var(--f-display); }
.month { padding: 10px; }
.wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wk.head span { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 4px 0 6px; }
.wk.head span.we { color: var(--fg); }
.dc {
  position: relative; min-height: 64px; border-radius: 10px; border: 1px solid transparent;
  padding: 5px 5px 6px; display: flex; flex-direction: column; justify-content: space-between;
  background: transparent; text-align: left; color: var(--muted); font: inherit;
}
.dc .n { font: 700 15px/1 var(--f-body); font-variant-numeric: tabular-nums; }
.dc.out { visibility: hidden; }
.dc.past, .dc.wkday { opacity: .45; cursor: default; }
.dc.closed { background: var(--surface-2); color: var(--muted); border-color: var(--line); cursor: pointer; }
.dc.open { background: var(--leaf-soft); border-color: color-mix(in srgb, var(--leaf) 45%, transparent); color: var(--leaf); cursor: pointer; }
.dc.booked { background: var(--chili-soft); border-color: color-mix(in srgb, var(--chili) 50%, transparent); color: var(--chili-ink); cursor: pointer; }
.dc.today { box-shadow: inset 0 0 0 2px var(--fg); }
.dc.sel { outline: 2px solid var(--leaf); outline-offset: 1px; }
.dc .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 2px; }
.dc .bot { display: flex; justify-content: space-between; align-items: flex-end; gap: 2px; min-height: 16px; }
.dc .offer { display: flex; gap: 3px; flex-wrap: wrap; }
.dc .offer i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.o-p { background: var(--leaf); } .o-d { background: var(--info); } .o-l { background: var(--turmeric); }
.dc .cnt {
  min-width: 16px; height: 16px; border-radius: 8px; padding: 0 4px; flex: none;
  background: var(--chili); color: #fff; font-size: 10.5px; font-weight: 700; line-height: 16px; text-align: center;
}
.dc .pend { width: 9px; height: 9px; border-radius: 50%; background: var(--turmeric); flex: none; margin-top: 2px; }
@media (min-width: 620px) { .dc { min-height: 84px; padding: 8px; } .dc .n { font-size: 17px; } .dc .offer i { width: 8px; height: 8px; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); padding: 2px 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; border: 1px solid var(--line); }
.sw.g { background: var(--leaf-soft); border-color: var(--leaf); } .sw.r { background: var(--chili-soft); border-color: var(--chili); }
.sw.c { background: var(--surface-2); } .sw.x { background: transparent; opacity: .5; }
.legend .dt { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.agenda .li { cursor: pointer; }
.agenda .cal { width: 46px; }
.day-orders { display: flex; flex-direction: column; gap: 8px; }
.sheet .day-body { border-top: 0; padding: 0; }

/* sheet (in-page dialog) */
.scrim { position: fixed; inset: 0; background: rgba(10,16,12,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); width: 100%; max-width: 620px; max-height: 92%; border-radius: 20px 20px 0 0;
  display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,.2);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 20px; max-height: 86%; } }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
.sheet-head h3 { margin: 0; font: 700 19px/1.2 var(--f-display); flex: 1; min-width: 0; }
.sheet-body { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.sheet-foot { padding: 12px 18px 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.sheet-foot .left { margin-right: auto; }

/* save bar & toast */
.savebar {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); z-index: 25;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: center;
}
.savebar .in { width: 100%; max-width: 728px; background: var(--fg); color: var(--bg); border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.savebar .in span { flex: 1; font-weight: 600; font-size: 14px; }
.savebar .btn.ghost { color: var(--bg); }
@media (min-width: 900px) { .savebar { left: 92px; bottom: 0; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + 80px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast.err { background: var(--bad); color: #fff; }

/* charts */
.bars { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-top: 8px; }
.bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; height: 100%; justify-content: flex-end; }
.bars .col { width: 100%; max-width: 44px; background: var(--leaf); border-radius: 6px 6px 2px 2px; min-height: 2px; }
.bars .b.zero .col { background: var(--line); }
.bars .v { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bars .l { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.hbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; font-size: 14px; }
.hbar .track { grid-column: 1 / -1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
.hbar .track i { display: block; height: 100%; background: var(--leaf); border-radius: 4px; }
.hbar .track.t i { background: var(--turmeric); }

.empty { text-align: center; color: var(--muted); padding: 28px 16px; }
.empty b { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px; }
.danger-zone { border-color: var(--bad-soft); }
.danger-zone h3 { color: var(--bad); margin: 0 0 4px; font-size: 16px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

// ---------------------------------------------------------------- server calls
async function api(method, url, body) {
  const res = await fetch(url, {
    method, credentials: "same-origin",
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined
  });
  const text = await res.text();
  if (!res.ok) throw new Error(text || ("Request failed (" + res.status + ")"));
  try { return JSON.parse(text); } catch (e) { throw new Error("Unexpected reply from the server"); }
}

  try { S.orders = await api("GET", "/admin/api/orders"); S.rangeReqs = await api("GET", "/admin/api/range-requests").catch(() => S.rangeReqs); S.customers = await api("GET", "/admin/api/customers").catch(() => S.customers); S.feedback = await api("GET", "/admin/api/feedback").catch(() => S.feedback); S.preorders = await api("GET", "/admin/api/preorders").catch(() => S.preorders); if (S.view === "orders" || S.view === "today" || S.view === "customers") render(); else updateDot(); } catch (e) {}
}

// ---------------------------------------------------------------- dirty / save
// Compare menus ignoring days that were opened and closed again.
function canon(menu) { const c = clone(menu); pruneDates(c); return JSON.stringify(c); }
function isDirty() { return !!S.menu && canon(S.menu) !== S.saved; }
function markDirty() {
  const dirty = isDirty();
  $("#saveBar").hidden = !dirty;
  $("#saveMsg").textContent = "Unsaved changes";
}
function pruneDates(menu) {
  menu.availability.dates = menu.availability.dates.filter(isOpen).sort((a, b) => (a.date < b.date ? -1 : 1));
}
async function save() {
  if (S.busy) return;
  const out = clone(S.menu);
  pruneDates(out);
  S.busy = true; $("#saveBtn").disabled = true; $("#saveMsg").textContent = "Saving…";
  try {
    if (S.mode === "live") {
      S.menu = ensureShape(await api("PUT", "/admin/api/menu", out));
    } else {
      S.menu = ensureShape(out);
    }
    S.saved = canon(S.menu);
    toast(S.mode === "live" ? "Saved. The bot uses it from the next message." : "Saved in this preview only");
    render();
  } catch (e) {
    toast(e.message, true);
    $("#saveMsg").textContent = "Not saved";
  } finally {
    S.busy = false; $("#saveBtn").disabled = false; markDirty();
  }
}
function discard() { S.menu = ensureShape(JSON.parse(S.saved)); render(); toast("Changes discarded"); }

let toastTimer = null;
function toast(msg, err) {
  const r = $("#toastRoot");
  r.innerHTML = '<div class="toast' + (err ? " err" : "") + '" role="status">' + esc(msg) + "</div>";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { r.innerHTML = ""; }, err ? 6000 : 2600);
}

// ---------------------------------------------------------------- sheet
let sheetOnClose = null;
function openSheet({ title, body, foot, onMount, onClose }) {
  const root = $("#sheetRoot");
  root.innerHTML =
    '<div class="scrim" data-scrim>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">' +
        '<div class="sheet-head"><h3 id="sheetTitle">' + esc(title) + '</h3>' +
          '<button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
        '<div class="sheet-body">' + body + "</div>" +
        (foot ? '<div class="sheet-foot">' + foot + "</div>" : "") +
      "</div></div>";
  sheetOnClose = onClose || null;
  const scrim = root.firstChild;
  scrim.addEventListener("click", (e) => { if (e.target === scrim || e.target.closest("[data-close]")) closeSheet(); });
  if (onMount) onMount(scrim.querySelector(".sheet"));
  const first = scrim.querySelector("input, textarea, select");
  if (first && window.innerWidth > 700) first.focus();
}
function closeSheet() { $("#sheetRoot").innerHTML = ""; if (sheetOnClose) { const f = sheetOnClose; sheetOnClose = null; f(); } }
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#sheetRoot").firstChild) closeSheet(); });

function confirmSheet({ title, text, confirmLabel, danger, typeWord, onConfirm }) {
  openSheet({
    title,
    body: "<p style=\"margin:0\">" + text + "</p>" +
      (typeWord ? '<label class="field"><span>Type ' + esc(typeWord) + ' to confirm</span><input id="confirmWord" autocomplete="off" autocapitalize="characters" /></label>' : ""),
    foot: '<button class="btn" data-close>Cancel</button><button class="btn ' + (danger ? "danger solid" : "primary") + '" id="confirmGo"' + (typeWord ? " disabled" : "") + ">" + esc(confirmLabel) + "</button>",
    onMount: (el) => {
      const go = el.querySelector("#confirmGo");
      if (typeWord) el.querySelector("#confirmWord").addEventListener("input", (e) => { go.disabled = e.target.value.trim() !== typeWord; });
      go.addEventListener("click", async () => { go.disabled = true; await onConfirm(); closeSheet(); });
    }
  });
}

// ---------------------------------------------------------------- shared bits
function statusPill(o) {
  const st = o.status || "Pending";
  let cls = "p-wait";
  if (st === "Confirmed") cls = "p-good";
  else if (/declined|cancelled/i.test(st)) cls = "p-bad";
  if (o.source === "past") return '<span class="pill p-off">Past order</span>';
  else if (/^released/i.test(st)) cls = "p-off";
  else if (/under review/i.test(st)) return '<span class="pill p-info">Check deposit</span>';
  else if (/awaiting deposit/i.test(st)) return '<span class="pill p-wait">Deposit due</span>';
  else if (/quote sent/i.test(st)) cls = "p-info";
  return '<span class="pill ' + cls + '">' + esc(o.pending && !/quote sent/i.test(st) ? "Waiting on you" : st) + "</span>";
}
function lineHTML(l) {
  const note = l.note ? ' <span class="note">– ' + esc(l.note) + "</span>" : "";
  if (l.isLiveDoseStation) {
    const parts = [];
    if (l.mdQty) parts.push(l.mdQty + " Mysore Masale Dose");
    if (l.odQty) parts.push(l.odQty + " Onion Dose");
    return "<div>LIVE Dose Station: " + esc(parts.join(" + ")) + (l.travelFee ? ' <span class="muted">(incl. ' + money(l.travelFee) + " travel)</span>" : "") + note + "</div>";
  }
  const q = Number(l.qty), qs = Number.isInteger(q) ? String(q) : (Math.floor(q) || "") + "½";
  return "<div>" + esc(qs) + " × " + esc(l.title) + (Number.isInteger(q) ? "" : ' <span class="muted">(half tray)</span>') + ' <span class="muted num">' + money(l.qty * l.price) + "</span>" + note + "</div>";
}
function depositHTML(p) {
  const code = p.confirmationCode || ((p.proofs || []).map((x) => x.code).filter(Boolean).slice(-1)[0]);
  const amt = '<span class="num">' + money(p.depositDue, true) + "</span>";
  if (p.state === "paid") return amt + " paid" + (code ? ' <span class="muted num">Zelle ' + esc(code) + "</span>" : "") + (p.balance > 0 ? ' · <span class="muted">balance <span class="num">' + money(p.balance, true) + "</span></span>" : "");
  if (p.state === "review") {
    const last = (p.proofs || []).slice(-1)[0] || {};
    return amt + " – screenshot in, tap <b>Payment received</b> on WhatsApp once it's in your bank" + (code ? ' <span class="muted num">(' + esc(code) + ")</span>" : "") +
      ((last.issues || []).length ? '<div class="note">Check: ' + esc(last.issues.join("; ")) + "</div>" : "");
  }
  if (p.state === "released") return amt + ' <span class="muted">not paid – released</span>';
  return amt + " due by " + esc(new Date(p.deadline).toLocaleString("en-US", { timeZone: TZ, weekday: "short", hour: "numeric", minute: "2-digit" }));
}
function canCancel(o) {
  if (o.source === "past" || /declined|cancelled|released|completed/i.test(o.status || "")) return false;

// ---------------------------------------------------------------- CHEF DAYS
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// Which calendar day an order is for: the saved event date, or (older
// orders) the "Sat, Oct 31" at the start of its requested time.
function orderDay(o) {
  if (o.eventDate) return o.eventDate;
  const m = /([A-Z][a-z]{2}) (\d{1,2})/.exec(o.requestedTime || "");
  if (!m || MON.indexOf(m[1]) < 0) return null;
  const base = new Date(o.createdAt || Date.now());
  let best = null;
  [-1, 0, 1].forEach((dy) => {
    const y = base.getFullYear() + dy;
    const iso = y + "-" + String(MON.indexOf(m[1]) + 1).padStart(2, "0") + "-" + String(m[2]).padStart(2, "0");
    const diff = Math.abs(new Date(iso + "T12:00:00Z") - base);
    if (!best || diff < best.diff) best = { iso, diff };
  });
  return best.iso;
}
function ordersByDay() {
  const map = {};
  S.orders.forEach((o) => {

// ---------------------------------------------------------------- REPORTS
function weekStart(iso) {
  const d = new Date(iso);
  const local = d.toLocaleDateString("en-CA", { timeZone: TZ });
  return addDays(local, -dow(local));
}
function viewReports() {
  const days = S.reportRange === "all" ? null : Number(S.reportRange);
  const since = days ? Date.now() - days * 864e5 : 0;
  const inRange = S.orders.filter((o) => new Date(o.createdAt || 0).getTime() >= since);
  const ok = inRange.filter((o) => o.status === "Confirmed");
  const revenue = ok.reduce((s, o) => s + Number(o.subtotal || 0), 0);
  const avg = ok.length ? revenue / ok.length : 0;
  const decided = inRange.filter((o) => o.status === "Confirmed" || /declined/i.test(o.status || ""));
  const rate = decided.length ? Math.round((ok.length / decided.length) * 100) : null;

  // weekly revenue - last 8 weeks (or range)
  const weeks = [];
  let ws = weekStart(new Date().toISOString());
  const nWeeks = days && days <= 30 ? 5 : 8;
  for (let i = nWeeks - 1; i >= 0; i--) weeks.push(addDays(ws, -7 * i));
  const byWeek = weeks.map((w) => ok.filter((o) => weekStart(o.createdAt) === w).reduce((s, o) => s + Number(o.subtotal || 0), 0));
  const maxW = Math.max(...byWeek, 1);

  // dishes
  const dish = {};
  ok.forEach((o) => (o.cart || []).forEach((l) => {
    const k = l.isLiveDoseStation ? "LIVE Dose Station (events)" : l.title;
    dish[k] = (dish[k] || 0) + (l.isLiveDoseStation ? 1 : Number(l.qty || 0));
  }));
  const top = Object.entries(dish).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const maxD = Math.max(1, ...top.map((x) => x[1]));

  // mix
  const kind = (o) => o.type === "custom" ? "Custom requests" : (o.cart || []).some((l) => l.isLiveDoseStation) ? "LIVE Dose Station" : o.fulfillment === "delivery" ? "Catering delivery" : "Catering pickup";
  const mix = {};
  ok.forEach((o) => { const k = kind(o); mix[k] = mix[k] || { n: 0, v: 0 }; mix[k].n++; mix[k].v += Number(o.subtotal || 0); });
  const mixRows = Object.entries(mix).sort((a, b) => b[1].v - a[1].v);
  const maxM = Math.max(1, ...mixRows.map((x) => x[1].v));

  const custs = {};
  ok.forEach((o) => { custs[o.customerPhone] = (custs[o.customerPhone] || 0) + 1; });
  const repeat = Object.values(custs).filter((n) => n > 1).length;

  const ranges = [["30", "Last 30 days"], ["90", "Last 90 days"], ["all", "All time"]];
  return '<div><h2 class="h-page">Reports</h2><p class="sub">Confirmed orders only, by the day they were placed.</p></div>' +
    '<div class="chips" role="group" aria-label="Report range">' + ranges.map((r) => '<button class="chip" data-act="range" data-r="' + r[0] + '" aria-pressed="' + (S.reportRange === r[0]) + '">' + r[1] + "</button>").join("") + "</div>" +
    '<div class="kpis four">' +
      '<div class="card kpi"><b>' + money(revenue) + "</b><span>Confirmed sales</span></div>" +
      '<div class="card kpi"><b>' + ok.length + "</b><span>Confirmed orders</span></div>" +
      '<div class="card kpi"><b>' + money(avg) + "</b><span>Average order</span></div>" +
      '<div class="card kpi"><b>' + (rate == null ? "–" : rate + "%") + "</b><span>Accepted vs declined</span></div>" +
    "</div>" +
    '<div class="card pad"><div class="row" style="justify-content:space-between"><b>Sales by week</b><span class="small muted">week starting Sunday</span></div>' +
      '<div class="bars" role="img" aria-label="Confirmed sales by week">' + byWeek.map((v, i) => {
        const p = dateParts(weeks[i]);
        return '<div class="b' + (v ? "" : " zero") + '"><span class="v">' + (v ? money(v) : "") + '</span><div class="col" style="height:' + Math.round((v / maxW) * 100) + '%"></div><span class="l">' + p.mon + " " + p.day + "</span></div>";
      }).join("") + "</div></div>" +
    '<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">' +
      '<div class="card pad"><b>Top dishes</b><p class="small muted" style="margin:2px 0 12px">Trays sold</p>' +
        (top.length ? '<div class="hbar">' + top.map(([k, n]) => '<span>' + esc(k) + '</span><span class="num muted">' + n + '</span><div class="track"><i style="width:' + Math.round((n / maxD) * 100) + '%"></i></div>').join("") + "</div>" : '<p class="muted small">No confirmed orders in this range.</p>') + "</div>" +
      '<div class="card pad"><b>Where sales come from</b><p class="small muted" style="margin:2px 0 12px">Confirmed sales by order type</p>' +
        (mixRows.length ? '<div class="hbar">' + mixRows.map(([k, m]) => '<span>' + esc(k) + ' <span class="muted small">(' + m.n + ')</span></span><span class="num">' + money(m.v) + '</span><div class="track t"><i style="width:' + Math.round((m.v / maxM) * 100) + '%"></i></div>').join("") + "</div>" : '<p class="muted small">No confirmed orders in this range.</p>') + "</div>" +
    "</div>" +
    '<div class="card pad row" style="justify-content:space-between"><div><b>' + Object.keys(custs).length + " customers</b><div class=\"small muted\">" + repeat + " ordered more than once</div></div>" +
      (S.mode === "live"
        ? '<div class="row"><a class="btn sm" href="/admin/api/orders.csv">Orders for Excel</a><a class="btn sm" href="/admin/api/customers.csv">Customers for Excel</a></div>'
        : '<span class="small muted">Excel downloads work on the live admin page.</span>') + "</div>";
}

function demoCustomers() {
  const map = {};
  S.orders.forEach((o) => {
    if (!o.customerPhone) return;
    const [first, ...rest] = String(o.customerName || "").split(" ");
    const c = map[o.customerPhone] || (map[o.customerPhone] = { phone: o.customerPhone, firstName: first || "", lastName: rest.join(" "), address: "", addressVerified: false, orders: 0, confirmedOrders: 0, confirmedTotal: 0, lastOrder: null, createdAt: o.createdAt });
    c.orders++;
    if (o.address && !c.address) { c.address = o.address; c.addressVerified = o.addressVerified !== false; }
    if (o.status === "Confirmed") { c.confirmedOrders++; c.confirmedTotal += Number(o.subtotal || 0); }
    if (!c.lastOrder || o.createdAt > c.lastOrder) c.lastOrder = o.createdAt;
    if (o.createdAt < c.createdAt) c.createdAt = o.createdAt;
  });
  return Object.values(map).map((c) => Object.assign(c, { stars: starsFor(c.confirmedOrders, c.confirmedTotal), family: false })).sort((a, b) => String(b.lastOrder).localeCompare(String(a.lastOrder)));
}
// Same rule as the server (customerReport.js): orders and value each score 1–5, rating is the average.
function starsFor(n, total) {
  if (!n) return 0;
  const pts = (v, steps) => steps.reduce((p, st, i) => (v >= st ? i + 1 : p), 0);
  return Math.max(1, Math.round((pts(n, [1, 2, 4, 7, 11]) + pts(total, [0.01, 100, 250, 500, 1000])) / 2));
}
function starText(n) {
  return '<span class="stars" aria-label="' + n + ' out of 5 stars">' + "★".repeat(n) + '<span class="off">' + "★".repeat(5 - n) + "</span></span>";
}

// ---------------------------------------------------------------- CHEF'S PICKS
function njToday() { return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); }
function promoOn(it) { return !!(it && it.promoted && (!it.promoUntil || it.promoUntil >= njToday())); }
function allDishes() {
  const out = [];
  S.menu.categories.forEach((c, ci) => { if (c.type !== "live-dose-station") (c.items || []).forEach((it, ii) => out.push({ c, ci, it, ii })); });
  return out;
}
function activePicks() { return allDishes().filter((d) => promoOn(d.it)); }
function promoMessage(rows, note) {
  const lines = rows.map((d) => "• " + d.it.title + (d.limited ? " (limited" + (d.lnote ? ": " + d.lnote : "") + ")" : ""));
  return (note ? note + "\n\n" : "") + lines.join("\n") + "\n\nOrder in the FTR app, or reply here on WhatsApp.";
}
/** Pick dishes to promote (and mark limited), save the menu, and optionally tell customers. */
function promoteSheet() {
  const dishes = allDishes();
  const until0 = (activePicks()[0] || {}).it?.promoUntil || "";

  openSheet({
    title: "Promote dishes",
    body:

          '<input data-ln="' + k + '" maxlength="60" placeholder="Limited note, e.g. Only 10 trays" value="' + esc(d.it.limitedNote || "") + '"' + (d.it.limited ? "" : " hidden") + ' style="flex-basis:100%" />' +
        "</div>").join("") + "</div>" +
      '<div class="grid2"><label class="field"><span>Pick note (optional)</span><input id="p-note" maxlength="80" value="' + esc(note0) + '" placeholder="e.g. Perfect for Diwali parties" /><span class="hint">Shown with the picks in the app.</span></label>' +
        '<label class="field"><span>Promote until (optional)</span><input id="p-until" type="date" value="' + esc(until0) + '" /><span class="hint">Picks stop showing after this day.</span></label></div>' +
      '<label class="switch"><input type="checkbox" id="p-notify" checked /><span><b>Tell customers now</b><small>Sends a "Chef\'s pick" notification: in the app (a phone alert if they turned on announcements) and on WhatsApp to anyone who messaged in the last 24 hours.</small></span></label>' +
      '<div id="p-msgWrap" class="stack">' +
        '<label class="field"><span>Title</span><input id="p-title" maxlength="60" value="Chef\'s picks this week" /></label>' +
        '<label class="field"><span>Message</span><textarea id="p-text" maxlength="1500" rows="6"></textarea><span class="hint">Filled in from your picks. Edit it as you like.</span></label>' +
        '<label class="field"><span>Send to</span><select id="p-aud">' + Object.entries(AUDIENCE_LABELS).map(([k, l]) => '<option value="' + k + '">' + esc(l) + "</option>").join("") + "</select></label>" +
        '<p class="small" id="p-reach" style="margin:0"></p>' +
      "</div>" +
      '<p class="small" id="p-err" style="color:var(--bad);margin:0" hidden></p>',
    foot: '<button class="btn" data-close>Cancel</button><button class="btn primary" id="p-ok">Save picks</button>',
    onMount: (el) => {
      let edited = false;
      const picked = () => dishes.map((d, k) => ({ ...d, on: el.querySelector('[data-pk="' + k + '"]').checked, limited: el.querySelector('[data-lk="' + k + '"]').checked, lnote: el.querySelector('[data-ln="' + k + '"]').value.trim() }));
      const notify = () => el.querySelector("#p-notify").checked;
      const refresh = () => {
        const rows = picked().filter((d) => d.on);
        el.querySelector("#p-msgWrap").hidden = !notify();
        el.querySelector("#p-ok").textContent = notify() && rows.length ? "Save and notify" : "Save picks";
        if (!edited) el.querySelector("#p-text").value = rows.length ? promoMessage(rows, el.querySelector("#p-note").value.trim()) : "";
      };
      const reach = async () => {
        const aud = el.querySelector("#p-aud").value;
        let r = null;
        if (S.mode === "live") r = await api("GET", "/admin/api/broadcasts/preview?audience=" + encodeURIComponent(aud)).catch(() => null);
        else { const n = (S.customers || []).length; r = { total: n, app: Math.ceil(n / 2), alerts: Math.ceil(n / 4), whatsapp: Math.floor(n / 4), unreachable: 0 }; }
        el.querySelector("#p-reach").innerHTML = r ? "<b>" + r.total + " customer" + (r.total === 1 ? "" : "s") + ".</b> " + r.app + " in the FTR app (" + r.alerts + " with a phone alert), " + r.whatsapp + " on WhatsApp." + (r.unreachable ? ' <span class="muted">' + r.unreachable + " can't be reached right now.</span>" : "") : "Couldn't check who this reaches.";
      };
      el.querySelectorAll("[data-lk]").forEach((cb) => cb.addEventListener("change", () => { el.querySelector('[data-ln="' + cb.dataset.lk + '"]').hidden = !cb.checked; refresh(); }));
      el.querySelectorAll("[data-pk], [data-ln], #p-note").forEach((x) => x.addEventListener("input", refresh));
      el.querySelectorAll("[data-pk]").forEach((x) => x.addEventListener("change", refresh));
      el.querySelector("#p-text").addEventListener("input", () => { edited = true; });
      el.querySelector("#p-notify").addEventListener("change", refresh);
      el.querySelector("#p-aud").addEventListener("change", reach);
      refresh(); reach();
      el.querySelector("#p-ok").addEventListener("click", async (ev) => {
        const err = el.querySelector("#p-err");
        const rows = picked();
        const on = rows.filter((d) => d.on);
        const note = el.querySelector("#p-note").value.trim(), until = el.querySelector("#p-until").value;
        if (until && until < njToday()) { err.textContent = "\"Promote until\" is in the past."; err.hidden = false; return; }
        const title = el.querySelector("#p-title").value.trim(), text = el.querySelector("#p-text").value.trim(), audience = el.querySelector("#p-aud").value;
        if (notify() && on.length && (!title || !text)) { err.textContent = "Give the notification a title and message, or untick Tell customers now."; err.hidden = false; return; }
        for (const d of rows) {
          Object.assign(d.it, { promoted: d.on, limited: d.limited, limitedNote: d.limited ? d.lnote : "" });
          if (d.on) Object.assign(d.it, { promoNote: note, promoUntil: until });
        }
        ev.target.disabled = true;
        closeSheet();
        await save();
        if (isDirty()) return; // save failed; its message is showing
        if (notify() && on.length) {
          try {
            let entry;
            if (S.mode === "live") { entry = await api("POST", "/admin/api/broadcasts", { title, text, audience, kind: "promo" }); await annRefresh(); }
            else { entry = { counts: { app: 0, whatsapp: 0 } }; }
            toast("Picks saved. Sent to " + entry.counts.app + " in the app and " + entry.counts.whatsapp + " on WhatsApp");
          } catch (e) { toast("Picks saved, but the notification didn't send: " + e.message, true); }
        }
      });
    }
  });
}

function demoRecipes() {

}
let qrLib = null;
function loadQrLib() {
  if (window.qrcode) return Promise.resolve(window.qrcode);
  if (!qrLib) qrLib = new Promise((ok, bad) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
    sc.onload = () => ok(window.qrcode); sc.onerror = () => { qrLib = null; bad(new Error("Couldn't load the QR code maker. Check the internet connection.")); };
    document.head.appendChild(sc);
  });
  return qrLib;
}
async function qrSvg(url, size) {
  const make = await loadQrLib();
  const q = make(0, "M"); q.addData(url); q.make();
  const n = q.getModuleCount(), m = 2, cell = size / (n + m * 2);
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += "M" + (c + m) + " " + (r + m) + "h1v1h-1z";
  return '<svg role="img" aria-label="QR code" width="' + size + '" height="' + size + '" viewBox="0 0 ' + (n + m * 2) + " " + (n + m * 2) + '" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#2E2A26"/></svg>';
}
/** A print-ready PNG: QR code with the recipe name and "Scan in the FTR-DOSE app" under it. */
async function qrPng(r) {
  const make = await loadQrLib();
  const q = make(0, "M"); q.addData(r.url); q.make();
  const n = q.getModuleCount(), cell = 24, m = 4, w = (n + m * 2) * cell, h = w + 170;
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const g = cv.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.fillStyle = "#2E2A26";
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) g.fillRect((x + m) * cell, (y + m) * cell, cell, cell);
  g.textAlign = "center";
  g.font = "600 46px -apple-system, Segoe UI, Roboto, sans-serif"; g.fillText((r.powder || r.title).slice(0, 34), w / 2, w + 40);
  g.font = "36px -apple-system, Segoe UI, Roboto, sans-serif"; g.fillStyle = "#6E5D55"; g.fillText("Scan in the FTR-DOSE app for Chef's recipe", w / 2, w + 100);
  return cv.toDataURL("image/png");
}
function viewRecipes() {
  const list = S.recipes || [];
  setTimeout(() => {
    document.querySelectorAll("[data-qr]").forEach(async (el) => {
      try { el.innerHTML = await qrSvg(el.dataset.qr, 132); } catch (e) { el.textContent = e.message; }
    });
  }, 0);
  return '<div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><span class="small muted">Each code only opens its own recipe, and only inside the app. Turn a recipe off to stop its code working.</span>' +
      '<button class="btn primary" data-act="rec-new">New recipe</button></div>' +
    (list.length
      ? '<div class="stack">' + list.map((r) =>
          '<article class="card order"><div class="row" style="gap:16px;align-items:flex-start;flex-wrap:wrap">' +
            '<div data-qr="' + esc(r.url) + '" style="width:132px;height:132px;flex:none" class="small muted">Making QR code…</div>' +
            '<div class="grow" style="min-width:200px"><div class="o-name">' + esc(r.title) + "</div>" +
              '<div class="o-meta">' + esc(r.powder || "") + (r.powder ? " · " : "") + (r.scans || 0) + " scan" + (r.scans === 1 ? "" : "s") + (r.active ? "" : ' · <span class="pill p-wait">Off</span>') + "</div>" +
              '<div class="small muted num" style="word-break:break-all;margin-top:6px">' + esc(r.url) + "</div>" +

function depositExample(kind) {

  const WD = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  if (kind === "cat") {
    const h = Number(p.cateringHoursBefore) || 0;
    if (h % 24 === 0) return "Saturday order → due by 11:59 PM " + WD[(6 - h / 24 - 1 + 70) % 7] + ".";
    return "Saturday order → due " + h + " hours before Saturday 12:00 AM.";
  }

  return "Saturday event → due " + WD[(6 - d + 70) % 7] + " by " + t12(p.ldsTime || "10:00") + ". Sunday event → " + WD[(7 - d + 70) % 7] + ".";

function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 2) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  if (h < 36) return h + " hr ago";
  return Math.round(h / 24) + " days ago";
}

document.addEventListener("input", (e) => {

    if (e2 && t.value) {
      if (t.dataset.part === "date" && e2.orderByDate === shiftISO(e2.date, -3)) e2.orderByDate = shiftISO(t.value, -3);
      e2[t.dataset.part] = t.value; markDirty();
    }
    return;
  }
  if (t.dataset.sess != null && t.dataset.part) {
    const w = S.menu.availability.liveDoseSessions[+t.dataset.sess];
    if (w && t.value) { w[t.dataset.part] = t.value; markDirty(); }

  }
  if (t.dataset.bind && BIND[t.dataset.bind]) { BIND[t.dataset.bind](t.type === "checkbox" ? t.checked : t.value.trim()); markDirty(); return; }
  if (t.dataset.act === "win-time") {

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "INPUT") return;
  const a = el.dataset.act, date = el.dataset.date;
  switch (a) {
    case "filter": S.filters.status = el.dataset.f; render(); break;
    case "range": S.reportRange = el.dataset.r; render(); break;
    case "goto-day": S.calMonth = monthKey(date); setTimeout(() => openDaySheet(date), 0); break;
    case "open-day": openDaySheet(date); break;
    case "month": S.calMonth = shiftMonth(S.calMonth, +el.dataset.n); render(); break;
    case "month-today": S.calMonth = monthKey(todayISO()); render(); break;
    case "pickup": { const en = entryFor(date, true); en[el.dataset.k] = !en[el.dataset.k]; refreshDaySheet(); break; }
    case "std-day": {
      const en = entryFor(date, true);

      refreshDaySheet(); break;
    }
    case "pre-add": {
      const list = (S.menu.availability.preorders = S.menu.availability.preorders || []);
      let d = nextFriday();
      while (list.some((x) => x.date === d)) d = shiftISO(d, 7);
      list.push({ date: d, pickupTime: "18:00", orderByDate: shiftISO(d, -3), orderByTime: "18:00" });
      list.sort((x, y) => (x.date < y.date ? -1 : 1));
      markDirty(); render(); break;
    }
    case "pre-cancel": {
      const dd = el.dataset.date, n = +el.dataset.n;
      openSheet({
        title: "Cancel the batch for " + el.dataset.label + "?",
        body: '<p style="margin:0">' + (n ? "All " + n + " customer" + (n === 1 ? "" : "s") + " with an order for this day will" : "Customers who order will") + " get a regret message: the batch is cancelled, any deposit will be refunded, and cancellations like this are rare and only happen in extreme situations. The day closes to new orders.</p>" +
          '<p class="small muted" style="margin:0">You refund paid deposits yourself by Zelle – the bot sends you the list.</p>' +
          '<label class="field"><span>Type CANCEL to confirm</span><input id="pcConfirm" autocomplete="off" /></label>',
        foot: '<button class="btn" data-close>Keep the batch</button><button class="btn danger solid" id="pcGo">Cancel batch</button>',
        onMount: (sh) => sh.querySelector("#pcGo").addEventListener("click", async () => {
          if (sh.querySelector("#pcConfirm").value.trim().toUpperCase() !== "CANCEL") { toast("Type CANCEL to confirm", true); return; }
          sh.querySelector("#pcGo").disabled = true;
          try {
            if (S.mode === "live") {
              const r = await api("POST", "/admin/api/preorders/" + encodeURIComponent(dd) + "/cancel", { confirm: "CANCEL" });
              S.preorders = await api("GET", "/admin/api/preorders").catch(() => S.preorders);
              S.orders = await api("GET", "/admin/api/orders").catch(() => S.orders);
              S.menu = ensureShape(await api("GET", "/admin/api/menu")); S.saved = canon(S.menu);
              toast("Batch cancelled – " + r.cancelled.length + " customer" + (r.cancelled.length === 1 ? "" : "s") + " told" + (r.refunds.length ? ", " + r.refunds.length + " deposit" + (r.refunds.length === 1 ? "" : "s") + " to refund" : ""));
            } else {
              S.preorders = (S.preorders || []).map((x) => (x.date === dd ? Object.assign({}, x, { cancelled: true, open: false }) : x));
              toast("Batch cancelled (demo)");
            }
            closeSheet(); render();
          } catch (err) { sh.querySelector("#pcGo").disabled = false; toast(err.message, true); }
        })
      });
      break;
    }
    case "pre-del": {
      (S.menu.availability.preorders || []).splice(+el.dataset.i, 1);
      markDirty(); render(); break;
    }
    case "lds-sess": {
      const en = entryFor(date, true), sess = S.menu.availability.liveDoseSessions;
      const m = (t) => { const [h, mi] = String(t).split(":").map(Number); return h * 60 + mi; };
      const on = sess.filter((w) => en.liveDose.some((x) => x.start && x.end && m(x.start) < m(w.end) && m(x.end) > m(w.start)));
      const w = sess[+el.dataset.i];
      const next = on.includes(w) ? on.filter((x) => x !== w) : on.concat([w]);
      en.liveDose = sess.filter((x) => next.includes(x)).map((x) => ({ start: x.start, end: x.end }));
      refreshDaySheet(); break;
    }
    case "win-add": {
      const en = entryFor(date, true), list = en[el.dataset.key];
      list.push(list.length ? { start: "18:00", end: "21:00" } : { start: "12:00", end: "15:00" });
      refreshDaySheet(); break;
    }
    case "win-del": { const en = entryFor(date, true); en[el.dataset.key].splice(+el.dataset.i, 1); refreshDaySheet(); break; }
    case "close-day": { const en = entryFor(date, true); Object.assign(en, { pickupAM: false, pickupPM: false, catering: [], liveDose: [] }); refreshDaySheet(); break; }
    case "copy-day": {
      const src = entryFor(date, true), to = addDays(date, 7), dst = entryFor(to, true);
      Object.assign(dst, clone({ pickupAM: src.pickupAM, pickupPM: src.pickupPM, catering: src.catering, liveDose: src.liveDose }));
      S.sheetDay = to; refreshDaySheet(); toast("Copied to " + dateParts(to).wd + ", " + dateParts(to).mon + " " + dateParts(to).day + ". Showing that day now."); break;
    }
    case "dev-out": {
      api("DELETE", "/admin/api/sessions/" + encodeURIComponent(el.dataset.id)).then(() => { toast("Signed out that device."); loadDevices(); }).catch((e) => toast(e.message));
      break;
    }
    case "dev-out-others": {
      confirmSheet({ title: "Sign out all other devices?", text: "Every other phone and browser will need to sign in with Chef's Google account again.", confirmLabel: "Sign out others", danger: true,
        onConfirm: () => api("POST", "/admin/api/sessions/sign-out-others").then(() => { toast("Signed out all other devices."); loadDevices(); }).catch((e) => toast(e.message)) });
      break;
    }
    case "logout": {
      const go = () => {
        if (S.mode !== "live") { toast("Preview only - on the real admin page this signs you out."); return; }
        S.leaving = true;
        const f = document.createElement("form");
        f.method = "post"; f.action = "/admin/logout";
        document.body.appendChild(f); f.submit();
      };
      if (isDirty()) confirmSheet({ title: "Log out without saving?", text: "You have unsaved changes. They'll be lost if you log out now.", confirmLabel: "Log out", danger: true, onConfirm: go });
      else go();
      break;
    }
    case "range": {
      const allow = el.dataset.allow === "1", phone = el.dataset.phone;
      const r = (S.rangeReqs || []).find((x) => x.phone === phone);
      confirmSheet({
        title: (allow ? "Allow " : "Decline ") + (r && r.name ? r.name : phone) + "?",
        text: allow ? "They'll be told you can come to " + esc(r ? r.address : "their address") + " and can finish their order." : "They'll be told you can't travel that far, and can try a different address or call you.",
        confirmLabel: allow ? "Allow" : "Decline", danger: !allow,
        onConfirm: async () => {
          try {
            let st = { status: allow ? "Allowed." : "Declined." };
            if (S.mode === "live") st = await api("POST", "/admin/api/range-requests/" + encodeURIComponent(phone), { allow });
            S.rangeReqs = (S.rangeReqs || []).filter((x) => x.phone !== phone);
            toast(st.status); render();
          } catch (err) { toast(err.message, true); }
        }
      });
      break;
    }
    case "del-cust": {
      const phone = el.dataset.phone;
      const c = (S.customers || []).find((x) => x.phone === phone) || {};
      const name = [c.firstName, c.lastName].filter(Boolean).join(" ") || phone;
      confirmSheet({
        title: "Delete " + name + "?",
        text: "This permanently removes " + esc(name) + " (" + esc(phone) + ") and their saved address from the customer list and the Google Sheet Customers tab. Their past orders stay. A backup copy is kept on the server. If they message again they'll be asked for their name.",
        confirmLabel: "Delete customer", danger: true, typeWord: "DELETE",
        onConfirm: async () => {
          try {
            if (S.mode === "live") await api("DELETE", "/admin/api/customers/" + encodeURIComponent(phone), { confirmPhone: phone });
            S.customers = (S.customers || []).filter((x) => x.phone !== phone);
            toast(name + " deleted"); render();
          } catch (err) { toast(err.message, true); }
        }
      });
      break;
    }
    case "qr-del": {
      confirmSheet({
        title: "Remove the Zelle QR code?",
        text: "Customers will still get your Zelle email/phone, just no QR picture.",
        confirmLabel: "Remove", danger: true,
        onConfirm: async () => {
          try { if (S.mode === "live") await api("DELETE", "/admin/api/zelle-qr"); S.qr = null; toast("QR code removed"); render(); }
          catch (err) { toast(err.message, true); }
        }
      });
      break;
    }
    case "edit-item": itemSheet(+el.dataset.ci, +el.dataset.ii); break;
    case "add-item": itemSheet(+el.dataset.ci, null); break;
    case "edit-cat": catSheet(+el.dataset.ci); break;
    case "add-cat": catSheet(null); break;
    case "promote": promoteSheet(); break;
    case "edit-lds": ldsSheet(+el.dataset.ci); break;
    case "cancel-order": {
      const o = S.orders.find((x) => x.orderId === el.dataset.id) || {};
      confirmSheet({
        title: "Cancel order " + el.dataset.id + "?",
        text: esc(o.customerName || "The customer") + " will get a WhatsApp message that you've cancelled it. The order stays in your records as “Cancelled by Chef”. Orders can only be cancelled before the 50% deposit is paid.",
        confirmLabel: "Cancel order", danger: true,
        onConfirm: async () => {
          try {
            if (S.mode === "live") {
              const upd = await api("POST", "/admin/api/orders/" + encodeURIComponent(el.dataset.id) + "/cancel", {});
              S.orders = S.orders.map((x) => (x.orderId === upd.orderId ? Object.assign({}, x, upd) : x));
            } else {
              Object.assign(o, { status: "Cancelled by Chef", pending: false });
              if (o.payment) o.payment.state = "cancelled";
            }
            toast("Order cancelled - customer told"); render();
          } catch (err) { toast(err.message, true); }
        }
      });
      break;
    }
    case "add-past": pastOrderSheet(); break;
    case "add-past-for": pastOrderSheet(String(el.dataset.phone).replace(/^1(?=\d{10}$)/, "")); break;
    case "fb-tab": S.custTab = el.dataset.t; if (S.custTab === "comments") markFeedbackRead(); render(); break;
    case "fb-for": S.custTab = "comments"; S.fbPhone = el.dataset.phone; markFeedbackRead(); render(); break;
    case "fb-all": S.fbPhone = null; render(); break;
    case "cust-tier": S.custTier = el.dataset.t; render(); break;
    case "ff": {
      const c = (S.customers || []).find((x) => x.phone === el.dataset.phone);
      if (!c) break;
      const on = !c.family;
      (async () => {
        try {
          if (S.mode === "live") await api("POST", "/admin/api/customers/" + encodeURIComponent(c.phone) + "/family", { family: on });
          c.family = on;
          toast((c.firstName || c.phone) + (on ? " is now friends & family" : " is back to a star rating")); render();
        } catch (err) { toast(err.message, true); }
      })();
      break;
    }
    case "ann-new": announceSheet(); break;
    case "rec-new": recipeSheet(null); break;
    case "rec-edit": recipeSheet((S.recipes || []).find((x) => x.id === el.dataset.id)); break;
    case "rec-png": {
      const r = (S.recipes || []).find((x) => x.id === el.dataset.id);
      qrPng(r).then((href) => { const a = document.createElement("a"); a.href = href; a.download = "FTR-recipe-QR-" + (r.title || "recipe").replace(/[^a-z0-9]+/gi, "-") + ".png"; a.click(); }).catch((e) => toast(e.message));
      break;
    }
    case "rec-del": {
      const r = (S.recipes || []).find((x) => x.id === el.dataset.id);
      if (!r) break;
      confirmSheet({
        title: "Delete " + r.title + "?",
        text: "Its QR code will stop working, including on packets you've already given out. To pause it instead, use Edit and turn the code off.",
        confirmLabel: "Delete recipe", danger: true,
        onConfirm: async () => {
          if (S.mode === "live") await api("DELETE", "/admin/api/recipes/" + encodeURIComponent(r.id));
          S.recipes = S.recipes.filter((x) => x.id !== r.id); toast("Recipe deleted"); render();
        }
      });
      break;
    }
    case "ann-skip":
      (async () => {
        try { if (S.mode === "live") { await api("POST", "/admin/api/broadcasts/pending/skip", {}); await annRefresh(); } else S.broadcasts.pending = null; toast("New dishes won't be announced"); render(); }
        catch (err) { toast(err.message, true); }
      })();
      break;
    case "ann-send-now":
      (async () => {
        try {
          if (S.mode === "live") { await api("POST", "/admin/api/broadcasts/pending/send", {}); await annRefresh(); }
          else { const p = S.broadcasts.pending; S.broadcasts.history.unshift({ id: "ANN-D", at: new Date().toISOString(), title: "New on the FTR menu", text: p.items.map((d) => "• " + d.title).join("\n"), audience: "all", audienceLabel: "Everyone", auto: true, counts: { total: 0, app: 0, alerts: 0, whatsapp: 0, unreachable: 0 } }); S.broadcasts.pending = null; }
          toast("New dishes announced"); render();
        } catch (err) { toast(err.message, true); }
      })();
      break;
    case "del-fb": {
      const id = el.dataset.id;
      confirmSheet({
        title: "Delete this comment?",
        text: "It's removed from this list and the Google Sheet Comments tab. A backup copy is kept on the server.",
        confirmLabel: "Delete comment", danger: true,
        onConfirm: async () => {
          try {
            if (S.mode === "live") await api("DELETE", "/admin/api/feedback/" + encodeURIComponent(id));
            S.feedback = (S.feedback || []).filter((f) => f.id !== id);
            toast("Comment deleted"); render();
          } catch (err) { toast(err.message, true); }
        }
      });
      break;
    }
    case "decide": {
      const id = el.dataset.id, act = el.dataset.do;
      const o = S.orders.find((x) => x.orderId === id) || {};
      const who = esc(o.customerName || "the customer");
      const send = async (extra) => {
        try {
          if (S.mode === "live") {
            const updated = await api("POST", "/admin/api/orders/" + encodeURIComponent(id) + "/decision", Object.assign({ action: act }, extra || {}));
            S.orders = S.orders.map((x) => (x.orderId === id ? updated : x));
          } else {
            const st = { endchat: o.status, approve: "Awaiting Deposit", decline: "Declined", paid: "Confirmed", unpaid: "Awaiting Deposit", quote: "Quote Sent", cdecline: "Declined" }[act];
            S.orders = S.orders.map((x) => (x.orderId === id ? Object.assign({}, x, act === "endchat" ? {} : { status: st, pending: act === "quote", quoted: act === "quote" }) : x));
          }
          toast({ approve: "Approved - " + (o.customerName || "customer") + " has been told", decline: "Declined - customer told", endchat: "Chat ended - customer told Chef will confirm shortly", paid: "Deposit marked paid - order confirmed", unpaid: "Customer asked to check their payment", quote: "Quote sent", cdecline: "Request declined - customer told" }[act]);
          render();
        } catch (err) { toast(err.message, true); }
      };
      if (act === "time" || act === "message") {
        const isTime = act === "time";
        const lds = (o.cart || []).some((l) => l.isLiveDoseStation);
        openSheet({
          title: isTime ? "Change the time" : "Message " + who,
          body: isTime
            ? '<p style="margin:0">Customer asked for: <b>' + esc((o.timeChangedByChef && o.timeChangedByChef.from) || o.requestedTime || "no time") + "</b></p>" +
              '<label class="field"><span>New time</span><input id="qTime" placeholder="' + (lds ? "6:30 PM - 8:30 PM" : "12:30 PM") + '" /></label>' +
              '<p class="small muted" style="margin:0">' + (lds ? "A single time keeps the booked serving length. " : "") + 'Put the date first to change the day, e.g. "11/8 ' + (lds ? "11 AM - 1 PM" : "12:30 PM") + '". The customer sees the new time when you approve.</p>'
            : '<label class="field"><span>Your message</span><textarea id="qMsg" rows="4" placeholder="e.g. Can you do 1 Huli and 1 Saaru instead?"></textarea></label>' +
              '<p class="small muted" style="margin:0">It goes from the FTR number. Their replies come to your WhatsApp with Approve / Edit / Decline buttons.</p>',
          foot: '<button class="btn" data-close>Cancel</button><button class="btn primary" id="qGo">' + (isTime ? "Save time" : "Send") + "</button>",
          onMount: (sh) => sh.querySelector("#qGo").addEventListener("click", async () => {
            const v = (sh.querySelector(isTime ? "#qTime" : "#qMsg").value || "").trim();
            if (!v) { toast(isTime ? "Enter the new time" : "Type your message", true); return; }
            sh.querySelector("#qGo").disabled = true;
            if (S.mode === "live") {
              try {
                const updated = await api("POST", "/admin/api/orders/" + encodeURIComponent(id) + "/decision", isTime ? { action: act, time: v } : { action: act, message: v });
                S.orders = S.orders.map((x) => (x.orderId === id ? updated : x));
                toast(isTime ? "Time changed - the customer sees it when you approve" : "Sent to " + (o.customerName || "the customer"));
                closeSheet(); render();
              } catch (err) { sh.querySelector("#qGo").disabled = false; toast(err.message, true); }
            } else {
              S.orders = S.orders.map((x) => (x.orderId === id ? Object.assign({}, x, isTime
                ? { requestedTime: v + " (set by Chef)", timeChangedByChef: { from: (x.timeChangedByChef && x.timeChangedByChef.from) || x.requestedTime, to: v } }
                : { chat: (x.chat || []).concat([{ from: "chef", text: v, at: new Date().toISOString() }]) }) : x));
              toast(isTime ? "Time changed (demo)" : "Sent (demo)"); closeSheet(); render();
            }
          })
        });
        break;
      }
      if (act === "quote" || act === "cdecline") {
        openSheet({
          title: act === "quote" ? "Send a quote" : "Decline this request",
          body: (o.request ? '<p style="margin:0">“' + esc(o.request) + "”</p>" : "") +
            (act === "quote" ? '<label class="field"><span>Price ($)</span><input id="qPrice" type="number" inputmode="decimal" min="1" /></label>' : "") +
            '<label class="field"><span>' + (act === "quote" ? "Note for the customer (optional)" : "Reason for the customer (optional)") + '</span><textarea id="qNote" rows="3"></textarea></label>',
          foot: '<button class="btn" data-close>Cancel</button><button class="btn ' + (act === "quote" ? "primary" : "danger solid") + '" id="qGo">' + (act === "quote" ? "Send quote" : "Decline") + "</button>",
          onMount: (sh) => sh.querySelector("#qGo").addEventListener("click", async () => {
            const price = act === "quote" ? parseFloat(sh.querySelector("#qPrice").value) : null;
            if (act === "quote" && !(price > 0)) { toast("Enter the price", true); return; }
            sh.querySelector("#qGo").disabled = true;
            await send({ price, note: sh.querySelector("#qNote").value.trim() });
            closeSheet();
          })
        });
        break;
      }
      const copy = {
        approve: ["Approve " + id + "?", who + " will be told it's approved" + (S.menu && S.menu.settings.payment && S.menu.settings.payment.enabled ? " and get the Zelle deposit details." : "."), "Approve", false],
        decline: ["Decline " + id + "?", who + " will be told you can't take this order.", "Decline", true],
        paid: ["Mark the deposit paid?", "Only if you can see the money in your bank app. " + who + " gets a payment confirmation and the order is confirmed.", "Payment received", false],
        unpaid: ["Payment not received?", who + " will be asked to check their Zelle payment and send a new screenshot.", "Not received", true]
      }[act];
      confirmSheet({ title: copy[0], text: copy[1], confirmLabel: copy[2], danger: copy[3], onConfirm: () => send() });
      break;
    }
    case "del-order": {
      const o = S.orders.find((x) => x.orderId === el.dataset.id);
      confirmSheet({
        title: "Delete order " + el.dataset.id + "?",
        text: "This removes " + esc((o && o.customerName) || "this order") + "'s order here and from the Google Sheet. It can't be undone.",
        confirmLabel: "Delete order", danger: true,
        onConfirm: async () => {
          try {
            if (S.mode === "live") await api("DELETE", "/admin/api/orders/" + encodeURIComponent(el.dataset.id));
            S.orders = S.orders.filter((x) => x.orderId !== el.dataset.id);
            toast("Order deleted"); render();
          } catch (err) { toast(err.message, true); }
        }
      });
      break;
    }
    case "reset": {
      confirmSheet({
        title: "Reset all orders?",
        text: "This deletes all " + S.orders.length + " orders. Saved customers are kept. A backup copy stays on the server.",
        confirmLabel: "Reset everything", danger: true, typeWord: "RESET",
        onConfirm: async () => {
          try {
            let r = { count: S.orders.length, sheet: "not connected" };
            if (S.mode === "live") r = await api("POST", "/admin/api/orders/reset", { confirm: "RESET" });
            S.orders = [];
            toast("Reset: " + r.count + " order(s) removed" + (String(r.sheet).startsWith("failed") ? ". Google Sheet not cleared." : "."), String(r.sheet).startsWith("failed"));
            render();
          } catch (err) { toast(err.message, true); }
        }
      });
      break;
    }
  }
});
document.addEventListener("change", async (e) => {
  if (e.target.id !== "qrFile" || !e.target.files[0]) return;
  const file = e.target.files[0];
  if (!/^image\/(png|jpeg)$/.test(file.type)) return toast("Please choose a PNG or JPG picture.", true);
  if (file.size > 5 * 1024 * 1024) return toast("That picture is over 5 MB.", true);
  try {
    if (S.mode === "live") {
      const res = await fetch("/admin/api/zelle-qr", { method: "PUT", credentials: "same-origin", headers: { "Content-Type": file.type }, body: file });
      const text = await res.text();
      if (!res.ok) throw new Error(text || "Upload failed");
      S.qr = JSON.parse(text);
    } else {
      S.qr = { url: URL.createObjectURL(file) };
    }
    toast("Zelle QR code saved"); render();
  } catch (err) { toast(err.message, true); }
});
$("#saveBtn").addEventListener("click", save);
$("#discardBtn").addEventListener("click", discard);
window.addEventListener("beforeunload", (e) => { if (isDirty() && !S.leaving) { e.preventDefault(); e.returnValue = ""; } });

boot();
})();
</script>
