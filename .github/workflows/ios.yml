# FTR iOS app on a cloud Mac (GitHub Actions) - no Mac of your own needed.
#
# 1. "Check build": every push compiles the app for the iPhone simulator.
#    Needs no Apple account - it just proves the code builds.
# 2. "Send to TestFlight": run by hand (Actions tab > iOS > Run workflow).
#    Builds, signs and uploads to App Store Connect / TestFlight.
#    Needs these repository secrets (Settings > Secrets and variables > Actions):
#      APPLE_TEAM_ID        10-character Team ID (developer.apple.com > Membership)
#      ASC_KEY_ID           App Store Connect API key ID
#      ASC_ISSUER_ID        App Store Connect API issuer ID
#      ASC_KEY_P8           the whole text of the downloaded AuthKey_XXXXXXXXXX.p8 file
name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload to TestFlight"
        type: boolean
        default: true
      runner:
        description: "Build on: Chef's Mac (Xcode 27, needed for iPhone Duo) or GitHub's cloud Mac (older Xcode)"
        type: choice
        options: [chefs-mac, cloud]
        default: chefs-mac

jobs:
  check-build:
    if: github.event_name == 'push'
    # Intel Mac: GitHub's Apple-silicon Macs are often full and cancel queued jobs.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Compile for the iPhone simulator
        run: |
          xcodebuild build \
            -project ios/FTR.xcodeproj -scheme FTR -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    # Chef's Mac has Xcode 27 (the iPhone Duo needs it); the Mac must be on and awake.
    runs-on: ${{ inputs.runner == 'cloud' && 'macos-15-intel' || fromJSON('["self-hosted","macOS","xcode27"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.environment == 'github-hosted'
        with:
          xcode-version: latest-stable
      - name: Xcode in use
        run: xcodebuild -version
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Archive (signed later, at export)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project ios/FTR.xcodeproj -scheme FTR -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/FTR.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Carry the app's entitlements (push notifications) into the archive
        run: |
          # An unsigned archive has no entitlements, so the App Store export
          # dropped push. A placeholder signature with them lets the export
          # read them and add push to the real distribution signature.
          codesign --force --sign - --entitlements ios/Config/FTR.entitlements \
            build/FTR.xcarchive/Products/Applications/FTR.app
          codesign -d --entitlements - build/FTR.xcarchive/Products/Applications/FTR.app
      - name: Sign for the App Store
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Apple signs it for the App Store with your team's distribution certificate
          # (no test iPhone needs to be registered).
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :destination export" ios/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/FTR.xcarchive -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          ls -la build/export
          unzip -q -o build/export/*.ipa -d build/ipa
          codesign -d --entitlements - build/ipa/Payload/*.app 2>&1 | head -40
          codesign -d --entitlements - build/ipa/Payload/*.app 2>&1 | grep -q aps-environment \
            || { echo "::warning::Push notifications (aps-environment) missing from the signed app"; }
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f build/export/*.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
      - name: Remove the App Store Connect key from this Mac
        if: always()
        run: rm -rf ~/private_keys build
