name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # lets the build sign in to Google without a key file

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Upload key for Google Play
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "FTR_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_UPLOAD_KEYSTORE_B64 secret not set - building unsigned (fine for a compile check, not for Play)."
          fi

      - name: Build the Play bundle and a test APK
        working-directory: android
        env:
          FTR_VERSION_CODE: ${{ github.run_number }}
          FTR_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          FTR_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          FTR_UPLOAD_KEY_ALIAS: upload
        run: gradle --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: FTR-DOSE-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      # Sends the new build straight to Play Console -> Internal testing.
      # Keyless: GitHub signs in to Google Cloud (project ftr-bot-513217) as the
      # ftr-play-upload account, which is invited in Play Console. Main branch only.
      - name: Sign in to Google
        id: google
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/428165957167/locations/global/workloadIdentityPools/github/providers/ftr-app
          service_account: ftr-play-upload@ftr-bot-513217.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload to Google Play internal testing
        if: github.ref == 'refs/heads/main'
        env:
          PLAY_TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          python3 android/scripts/play_upload.py \
            android/app/build/outputs/bundle/release/app-release.aab \
            android/app/build/outputs/mapping/release/mapping.txt \
            "Build ${{ github.run_number }}"
