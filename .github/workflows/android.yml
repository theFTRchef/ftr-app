name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Upload key for Google Play
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "FTR_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_UPLOAD_KEYSTORE_B64 secret not set - building unsigned (fine for a compile check, not for Play)."
          fi

      - name: Build the Play bundle and a test APK
        working-directory: android
        env:
          FTR_VERSION_CODE: ${{ github.run_number }}
          FTR_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          FTR_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          FTR_UPLOAD_KEY_ALIAS: upload
        run: gradle --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: FTR-DOSE-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      # Sends the new build straight to Play Console → Internal testing.
      # Needs the PLAY_SERVICE_ACCOUNT_JSON secret (a Google Cloud service account
      # invited to Play Console with release permission). Skipped until it's added.
      - name: Check for the Play upload key
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::PLAY_SERVICE_ACCOUNT_JSON not set - download the .aab and upload it to Play Console by hand."; fi

      - name: Upload to Google Play internal testing
        if: steps.play.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.franklintiffinroom.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: completed
          releaseName: "Build ${{ github.run_number }}"
