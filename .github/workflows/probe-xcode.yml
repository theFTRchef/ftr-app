name: Probe Xcode

# Lists the Xcode versions and iPhone simulators on the newest macOS runner (run by hand).
on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          sw_vers
          ls -d /Applications/Xcode* || true
          for x in /Applications/Xcode_2[67]*.app; do echo "== $x"; DEVELOPER_DIR=$x/Contents/Developer xcrun simctl list devicetypes 2>/dev/null | grep -iE "duo|fold|iPhone 1[78]" ; DEVELOPER_DIR=$x/Contents/Developer xcodebuild -showsdks 2>/dev/null | grep -i iphoneos; done
